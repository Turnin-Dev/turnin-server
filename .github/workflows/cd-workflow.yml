name: Backend CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 설정 (의존성 + 빌드 캐시 자동 관리)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
        with:
          cache-read-only: false

      # 4. FatJar 빌드 (-x test: CI에서 이미 검증했으므로 생략)
      - name: Build FatJar
        run: ./gradlew buildFatJar -x test --no-daemon

      # 5. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Docker 이미지 빌드 & 푸시
      - name: Build & Push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: |
            turnindev/turnin-api:latest
            turnindev/turnin-api:${{ github.run_number }}

  deploy:
    runs-on: ubuntu-latest
    needs: build  # build job 완료 후 실행

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # 2. 배치 위험 구간 체크 (KST 00:55 ~ 01:05)
      - name: Check deploy time (avoid batch window)
        run: |
          NOW=$(TZ="Asia/Seoul" date +"%H%M")
          if [ "$NOW" -ge "0055" ] && [ "$NOW" -le "0105" ]; then
            TARGET=$(TZ="Asia/Seoul" date -d "$(TZ="Asia/Seoul" date '+%Y-%m-%d') 01:06:00 KST" +%s)
            CURRENT=$(date +%s)
            WAIT=$((TARGET - CURRENT))
            if [ "$WAIT" -gt "0" ]; then
              echo "⚠️ 배치 위험 구간입니다. ${WAIT}초 대기합니다. (01:06 재개)"
              sleep $WAIT
              echo "✅ 대기 완료. 배포를 재개합니다."
            fi
          fi

      # 3. docker-compose.yml 서버로 전송
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "docker-compose.yml"
          target: "~/turnin/"

      # 4. SSH로 서버 접속 → 자동 배포
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            # Docker Login
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            
            # Docker
            cd ~/turnin
            docker compose pull ktor
            docker compose up -d --no-deps --force-recreate ktor            
            docker image prune -f
            
            # healthy 될 때까지 대기 (최대 60초)
            timeout 60 bash -c "
              until [ \"\$(docker inspect --format={{.State.Health.Status}} \$(docker compose ps -q ktor))\" = 'healthy' ]; do
                sleep 3
              done
            "
            
            if [ \$? -ne 0 ]; then
              echo "Deploy failed"
              docker compose logs --tail=50 ktor
              exit 1
            fi
            
            # 이미지 정리 (최근 3개 유지)
            docker images turnindev/turnin-api --format "{{.Tag}}" \
              | grep -v latest \
              | sort -n \
              | tail -n +4 \
              | xargs -r -I {} docker rmi turnindev/turnin-api:{}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}