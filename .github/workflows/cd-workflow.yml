name: Backend CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v6

      # 2. JDK 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 설정 (의존성 + 빌드 캐시 자동 관리)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 4. FatJar 빌드 (-x test: CI에서 이미 검증했으므로 생략)
      - name: Build FatJar
        run: ./gradlew buildFatJar -x test --no-daemon

      # 5. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Docker 이미지 빌드 & 푸시
      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: turnindev/turnin-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build  # build job 완료 후 실행

    steps:
      # 8. SSH로 서버 접속 → 자동 배포
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/turnin
            docker compose pull ktor
            docker compose up -d --no-deps --force-recreate ktor            
            docker image prune -f