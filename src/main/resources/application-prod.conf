include "application.conf"

ktor {
  development = false
  environment = "prod"

  deployment {
    port = 8081
  }

  db {
    url = ${DB_URL}
    user = ${DB_USER}
    password = ${DB_PASSWORD}
  }

  security {
    jwt {
      realm = ${JWT_REALM}
      issuer = ${JWT_ISSUER}
      audience = ${JWT_AUDIENCE}
      name = ${JWT_NAME}
      secret = ${JWT_SECRET}
      accessTokenExpiresIn = ${JWT_ACCESS_TOKEN_EXPIRES_IN}
      refreshTokenExpiresIn = ${JWT_REFRESH_TOKEN_EXPIRES_IN}
    }
    cloudflare {
      s3AccessKey = ${S3_ACCESS_KEY}
      s3SecretKey = ${S3_SECRET_KEY}
      s3BucketName = ${S3_BUCKET_NAME}
      s3Endpoint = ${S3_ENDPOINT}
      s3Region = ${S3_REGION}
    }
  }

  ml {
    modelPath = ${ML_MODEL_PATH}
    tokenizerPath = ${ML_TOKENIZER_PATH}
  }

  firebase {
    serviceAccountPath = ${FIREBASE_SERVICE_ACCOUNT_PATH}
  }

  admin {
    jwtSecretKey = ${?JWT_ADMIN_SECRET}
    secretKey = ${?ADMIN_SECRET_KEY}
  }
}